version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nasiyago-postgres
    restart: always
    environment:
      POSTGRES_USER: nasiyago
      POSTGRES_PASSWORD: nasiyago_secret_password
      POSTGRES_DB: nasiyago_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - nasiyago-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nasiyago-backend
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://nasiyago:nasiyago_secret_password@postgres:5432/nasiyago_db?schema=public
      JWT_SECRET: nasiyago_production_secret_key_tashkent_2026
      JWT_EXPIRES_IN: 7d
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-mock_bot_token}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-mock_chat_id}
      CLIENT_URL: http://localhost:3000
      BACKEND_URL: http://localhost:5000
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    volumes:
      - backend-uploads:/app/uploads
    networks:
      - nasiyago-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nasiyago-frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:5000
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - nasiyago-net

volumes:
  pgdata:
  backend-uploads:

networks:
  nasiyago-net:
    driver: bridge
